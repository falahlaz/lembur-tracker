name: Push on Main Pipeline

on:
  push:
    branches: [ main ]

jobs:

  unit-test:
    name: Run tests
    runs-on: ubuntu-latest

    steps:
      - name: Setup PHP
        uses: shivammathur/setup-php@15c43e89cdef867065b0213be354c2841860869e
        with:
          php-version: '8.4'

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup app
        run: composer setup

      - name: Run Unit Tests
        run: composer test

