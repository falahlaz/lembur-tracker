name: Push on Main Pipeline

on:
  push:
    branches: [ main, dev ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:

  unit-test:
    name: Run tests
    runs-on: ubuntu-latest

    steps:
      - name: Setup PHP
        uses: shivammathur/setup-php@15c43e89cdef867065b0213be354c2841860869e
        with:
          php-version: '${{ vars.PHP_VERSION }}'
          extensions: ${{ vars.PHP_EXTENSIONS }}
          ini-values: memory_limit=${{ vars.MEMORY_LIMIT }}

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup app
        run: composer setup

      - name: Run Unit Tests
        run: composer test

  image-build:
    name: Image build
    needs: unit-test
    runs-on: ubuntu-latest
    environment: Docker Hub

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Docker meta (app)
        id: meta-app
        uses: docker/metadata-action@v6
        with:
          images: |
            ${{ vars.DOCKERHUB_USERNAME }}/${{ vars.APP_NAME }}-app
          tags: |
            type=ref,event=branch

      - name: Docker meta (web)
        id: meta-web
        uses: docker/metadata-action@v6
        with:
          images: |
            ${{ vars.DOCKERHUB_USERNAME }}/${{ vars.APP_NAME }}-web
          tags: |
            type=ref,event=branch

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push (app)
        uses: docker/build-push-action@v7
        with:
          push: true
          target: runtime
          tags: ${{ steps.meta-app.outputs.tags }}
          labels: ${{ steps.meta-app.outputs.labels }}

      - name: Build and push (web)
        uses: docker/build-push-action@v7
        with:
          push: true
          target: web
          tags: ${{ steps.meta-web.outputs.tags }}
          labels: ${{ steps.meta-web.outputs.labels }}

  deploy:
    name: Deploy
    needs: image-build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Ensure target directory exists
        uses: appleboy/ssh-action@v1.2.0
        with:
          passphrase: ${{ secrets.SSH_PASSPHRASE }}
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: mkdir -p /home/${{ secrets.SSH_USER }}/${{ vars.APP_NAME }}

      - name: Copy docker-compose.yml
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          passphrase: ${{ secrets.SSH_PASSPHRASE }}
          source: "docker-compose.yml"
          target: "/home/${{ secrets.SSH_USER }}/${{ vars.APP_NAME }}"

      - name: Set Environment Variables
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          passphrase: ${{ secrets.SSH_PASSPHRASE }}
          script: |
            cd /home/${{ secrets.SSH_USER }}/${{ vars.APP_NAME }}

            cat << 'EOF' > .env
            APP_NAME=LemburKu
            APP_ENV=${{ secrets.APP_ENV }}
            APP_KEY=${{ secrets.APP_KEY }}
            APP_DEBUG=${{ secrets.APP_DEBUG }}
            APP_URL=${{ secrets.APP_URL }}

            APP_LOCALE=id
            APP_FALLBACK_LOCALE=en
            APP_FAKER_LOCALE=id_ID

            APP_MAINTENANCE_DRIVER=file

            BCRYPT_ROUNDS=12

            LOG_CHANNEL=stack
            LOG_STACK=single
            LOG_DEPRECATIONS_CHANNEL=null
            LOG_LEVEL=debug

            DB_CONNECTION=${{ secrets.DB_CONNECTION }}
            DB_HOST=${{ secrets.DB_HOST }}
            DB_PORT=${{ secrets.DB_PORT }}
            DB_DATABASE=${{ secrets.DB_DATABASE }}
            DB_USERNAME=${{ secrets.DB_USERNAME }}
            DB_PASSWORD=${{ secrets.DB_PASSWORD }}

            SESSION_DRIVER=database
            SESSION_LIFETIME=480
            SESSION_ENCRYPT=false
            SESSION_PATH=/
            SESSION_DOMAIN=null
            SESSION_SECURE_COOKIE=false

            BROADCAST_CONNECTION=log
            FILESYSTEM_DISK=local
            QUEUE_CONNECTION=database

            CACHE_STORE=database

            MEMCACHED_HOST=127.0.0.1

            REDIS_CLIENT=${{ secrets.REDIS_CLIENT }}
            REDIS_HOST=${{ secrets.REDIS_HOST }}
            REDIS_PASSWORD=${{ secrets.REDIS_PASSWORD }}
            REDIS_PORT=${{ secrets.REDIS_PORT }}

            MAIL_MAILER=log
            MAIL_SCHEME=null
            MAIL_HOST=127.0.0.1
            MAIL_PORT=2525
            MAIL_USERNAME=null
            MAIL_PASSWORD=null
            MAIL_FROM_ADDRESS="hello@example.com"
            MAIL_FROM_NAME="${APP_NAME}"

            VITE_APP_NAME="${APP_NAME}"

            APP_TIMEZONE=UTC
            APP_DISPLAY_TIMEZONE=Asia/Jakarta

            APP_PORT=${{ secrets.APP_PORT }}
            DB_ROOT_PASSWORD=${{ secrets.DB_ROOT_PASSWORD }}

            KIMAI_BASE_URL=${{ secrets.KIMAI_BASE_URL }}
            KIMAI_TAGS=${{ secrets.KIMAI_TAGS }}
            KIMAI_ORDER_PARAM=${{ secrets.KIMAI_ORDER_PARAM }}
            KIMAI_DEFAULT_PROJECT=${{ secrets.KIMAI_DEFAULT_PROJECT }}

            KIMAI_LEAVE_ACTIVITY=${{ secrets.KIMAI_LEAVE_ACTIVITY }}
            KIMAI_LEAVE_PROJECT=${{ secrets.KIMAI_LEAVE_PROJECT }}
            KIMAI_LEAVE_DESCRIPTION="${{ secrets.KIMAI_LEAVE_DESCRIPTION }}"

            EOF

      - name: Deploy
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          passphrase: ${{ secrets.SSH_PASSPHRASE }}
          script: |
            cd /home/${{ secrets.SSH_USER }}/${{ vars.APP_NAME }}

            docker compose pull app nginx
            docker compose run --rm app php artisan migrate --force
            docker compose up -d
            docker image prune -f