server {
    listen 80;
    server_name _;
    root /var/www/html/public;
    index index.php;

    client_max_body_size 16M;

    # HTTPS ditutup di reverse proxy VPS; header ini yang membuat Laravel
    # membangun URL https dengan benar di belakangnya.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_read_timeout 120;
    }

    # Hanya direktori hasil build yang disajikan langsung sebagai berkas statis.
    # Sebelumnya blok ini berupa regex `\.(css|js|...)$` tanpa try_files, sehingga
    # ikut menangkap /livewire/livewire.js — itu route, bukan berkas — dan nginx
    # menjawab 404. Tanpa livewire.js, Livewire beserta Alpine di dalamnya tidak
    # pernah termuat: tombol Masuk mati dan toggle password tidak berfungsi.
    # `^~` membuat nginx melewati evaluasi regex; path lain jatuh ke `location /`
    # dan diteruskan ke index.php sebagaimana mestinya.
    location ^~ /build/ {
        try_files $uri =404;
        expires 1y;
        access_log off;
        add_header Cache-Control "public, immutable";
    }

    # Diterbitkan oleh `php artisan filament:upgrade` saat image dibangun.
    location ^~ /css/ {
        try_files $uri =404;
        expires 1y;
        access_log off;
        add_header Cache-Control "public, immutable";
    }

    location ^~ /js/ {
        try_files $uri =404;
        expires 1y;
        access_log off;
        add_header Cache-Control "public, immutable";
    }

    location ~ /\.(?!well-known) { deny all; }
}
