memory_limit = 512M
upload_max_filesize = 16M
post_max_size = 16M
max_execution_time = 120

; Timestamp disimpan UTC; tampilan dikonversi ke Asia/Jakarta di lapisan aplikasi.
date.timezone = UTC

opcache.enable = 1
opcache.memory_consumption = 192
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 0
